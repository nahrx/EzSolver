services:
  ezsolver:
    build: .
    image: ezsolver:latest
    container_name: ezsolver
    ports:
      - "${PORT:-8191}:8191"
    environment:
      PORT: "8191"
    shm_size: "512mb"
    volumes:
      - ts_profile:/data/ts_profile
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  ts_profile:
